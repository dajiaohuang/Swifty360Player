name: "Swifty360Player CI"

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests (iOS Simulator)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run unit tests
        shell: bash
        run: |
          set -euo pipefail
          simulator_id="$(python3 - <<'PY'
          import json
          import re
          import subprocess
          import sys

          payload = json.loads(subprocess.check_output(
              ["xcrun", "simctl", "list", "devices", "available", "-j"],
              text=True,
          ))
          candidates = []
          for runtime, devices in payload.get("devices", {}).items():
              match = re.fullmatch(r"com\.apple\.CoreSimulator\.SimRuntime\.iOS-(\d+(?:-\d+)*)", runtime)
              if match is None:
                  continue
              version = tuple(int(part) for part in match.group(1).split("-"))
              for device in devices:
                  name = device.get("name", "")
                  if device.get("isAvailable") and name.startswith("iPhone"):
                      candidates.append((version, name, device["udid"]))

          if not candidates:
              sys.exit("No available iPhone iOS Simulator was found.")

          _, name, udid = max(candidates)
          print(f"Selected simulator: {name} ({udid})", file=sys.stderr)
          print(udid)
          PY
          )"
          xcodebuild \
            -workspace "Swifty360Player.xcworkspace" \
            -scheme "Swifty360Player" \
            -destination "platform=iOS Simulator,id=${simulator_id}" \
            -derivedDataPath "${RUNNER_TEMP}/Swifty360PlayerDerivedData" \
            clean test
